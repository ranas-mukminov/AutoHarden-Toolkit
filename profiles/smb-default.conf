# smb-default — safe baseline for SMB / small Linux servers
# Used by: bin/autoharden run|report --profile smb-default
# Default mode is dry-run; pass --apply to change the host.

PROFILE_NAME="smb-default"
PROFILE_DESCRIPTION="Safe CIS-oriented baseline for SMB and small standalone Linux servers"

# Modules to run (order matters)
MODULES="ssh sysctl packages firewall"

# SSH (OpenSSH server)
SSH_PasswordAuthentication=no
SSH_PermitRootLogin=no
SSH_MaxAuthTries=3
SSH_X11Forwarding=no
SSH_AllowTcpForwarding=no

# Kernel / network sysctl (conservative). One "key = value" per line.
read -r -d '' SYSCTL_RULES <<'SYSCTL_EOF' || true
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.tcp_syncookies = 1
kernel.randomize_va_space = 2
SYSCTL_EOF

# Packages: ensure present (install only with --apply)
PACKAGES_ENSURE="openssh-server curl ca-certificates"

# Firewall: optional UFW baseline (skipped if ufw missing; never auto-enables without --apply)
FIREWALL_ENABLE_UFW=yes
FIREWALL_DEFAULT_INCOMING=deny
FIREWALL_DEFAULT_OUTGOING=allow
FIREWALL_ALLOW_SSH=yes
